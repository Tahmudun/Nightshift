  # IDENTITY CORRECTION — READ BEFORE FILLING THIS IN.
  # jobs.lever.co/alloy is **Alloy.ai**, the supply-chain analytics company
  # headquartered in San Francisco, with offices in Denver, Vancouver, DC and
  # Berlin. The DC/Denver/Vancouver posting spread is the tell and it matches
  # their careers page exactly.

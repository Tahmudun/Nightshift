  # -- Registry boards with no NYC signal in their postings -----------------
  #
  # Blank is the expected answer for most of these, and blank is correct. If one
  # of them does have a New York office, fill in `street_address`, `city: New
  # York` and `state: NY` — the registry's `nyc_presence` flag reads posting
  # text and posting text is not a company directory.
  #
  # An office outside the five boroughs cannot be loaded today: NYC GeoSearch is
  # the only geocoder wired up and its whole corpus is New York City, so a
  # London or Oslo address is reported `unresolved` rather than placed. That is
  # the honest outcome and not a bug to work around — the city this product
  # draws is New York.

  # Seeded: `make seed` loads Alloy's committed Lever board, so an address here
  # changes what `make demo` shows. Its postings are DC, Denver and Vancouver.

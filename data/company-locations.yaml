  # It is NOT Alloy the NYC identity-decisioning fintech (alloy.com, offices
  # around Union Square). Those are two different companies that share a name,
  # and the NYC one is the trap: search "Alloy" and you get 41 E 11th Street or
  # 88 University Place, both real, both in Manhattan, both geocodable, and
  # both completely wrong for this board. That is the exact failure mode the
  # header warns about — a wrong building that looks as confident as a right
  # one.
  #
  # Left blank because Alloy.ai has no New York office at all. Its SF HQ (548
  # Market St) is a PMB virtual mailbox, so even the geocoder-permitting
  # version of this row would be a mail drop rather than an office.
  - company: Alloy

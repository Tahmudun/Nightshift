name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR cancels the first run. Waiting on a stale run is how a
# five-minute CI becomes a fifteen-minute one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  # Every `pip install` in every job below reads this (pip maps PIP_<OPTION> to
  # the flag of the same name), so the pin is set once here rather than added to
  # three install steps that could drift apart. Relative to the repo root, which
  # is where all three install steps run.
  #
  # These jobs gate a merge, so they are pinned: ADR 0016. The early warning
  # that pinning gives up is bought back by dependency-canary.yml, which
  # installs unpinned on a schedule and gates nothing.
  PIP_CONSTRAINT: services/api/constraints-ci.txt

# AMENDMENTS A14 sets the scope: format, lint, typecheck, unit tests both
# languages, migration up/down, build, secret scan. Target under five minutes.
# Visual regression (M5), 3D perf gates (M5), load tests (M8), and coverage
# thresholds (M3) are deliberately absent — a slow CI is a CI you start skipping.
#
# The `e2e` job is one addition to that list, argued for in the job's own comment:
# it is the only automated check that a real board's jobs reach a browser, which
# is an M0 acceptance criterion. Jobs run in parallel, so the target holds.

jobs:
  python:
    name: python — lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A postgres service, so the database-backed tests (`requires_db` /
    # `pytest.mark.integration` in services/api/tests/conftest.py) actually run
    # here instead of silently skipping. Without this, `conftest.py`'s
    # `db_engine` fixture cannot reach a database, skips, and CI stays green
    # while 13 tests — including the only coverage of the ingestion pipeline
    # and the API routes against a real database — never execute. Identical to
    # the `migrations` job's service below on purpose: that recipe is already
    # proven in CI, so this copies it rather than retyping the image tag from
    # memory (see that job's comment for why the tag is load-bearing).
    services:
      postgres:
        image: imresamu/postgis:16-3.4-bundle0
        env:
          POSTGRES_USER: nightshift
          POSTGRES_PASSWORD: nightshift_ci
          POSTGRES_DB: nightshift
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nightshift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: nightshift
      POSTGRES_PASSWORD: nightshift_ci
      POSTGRES_DB: nightshift
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      NIGHTSHIFT_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/api[dev]"

      - name: The pin covers everything that got installed
        # `-c` pins only the distributions the file names. A dependency added to
        # pyproject.toml and never regenerated into constraints-ci.txt installs
        # at whatever version is newest, and nothing anywhere says so — the pin
        # would quietly become partial while still being described as a pin.
        # Compare the resolved set against the file so "CI is pinned" is a
        # checked claim. This runs in one job because all three install steps
        # run the identical command against the identical constraints file.
        run: |
          pip freeze --exclude-editable \
            | grep -vE '^(pip|setuptools|wheel)==' | sort -f > /tmp/installed.txt
          grep -vE '^\s*(#|$)' services/api/constraints-ci.txt | sort -f > /tmp/pinned.txt
          if ! diff -u /tmp/pinned.txt /tmp/installed.txt; then
            echo "::error::the installed set does not match services/api/constraints-ci.txt (- expected, + actual) — run 'make constraints' and commit the result"
            exit 1
          fi
          echo "$(wc -l < /tmp/pinned.txt) distributions, all pinned"

      - name: Format check
        run: ruff format --check services/api

      - name: Lint
        run: ruff check services/api

      - name: Typecheck
        run: mypy nightshift
        working-directory: services/api

      - name: Create extensions
        # Mirrors infra/postgres/init/001-extensions.sql. CREATE EXTENSION needs
        # superuser, so it is not the migration's job in any environment.
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U nightshift -d nightshift \
            -f infra/postgres/init/001-extensions.sql

      - name: Migrate
        run: alembic upgrade head
        working-directory: services/api

      - name: Cache the embedding model
        # ~130 MB of ONNX weights (AMENDMENTS A5). Cached so CI does not pull
        # them from the HF hub on every push, and — more importantly — so the
        # real-model tests in tests/test_embeddings.py and the similarity half
        # of the dedupe suite keep *running* here. They skip when the weights
        # are absent, which would be a green suite that never checked the one
        # component whose determinism the fixture set depends on.
        uses: actions/cache@v4
        with:
          path: ~/.cache/nightshift/fastembed
          key: fastembed-bge-small-en-v1.5-v1

      - name: Fetch the embedding model
        run: make model

      - name: Cache the map tiles
        # ~91 MB of NYC vector tiles (ADR 0022), cached for the same reason as
        # the model above: without it,
        # test_the_downloaded_artifact_matches_the_manifest *skips*, and the one
        # end-to-end claim this pipeline makes — that the pinned digest matches
        # what the release actually serves — never gets checked anywhere.
        # The key carries the digest, so re-baking invalidates the cache rather
        # than serving the previous map forever.
        uses: actions/cache@v4
        with:
          path: ~/.cache/nightshift/basemap
          key: tiles-${{ hashFiles('data/basemap.manifest.json', 'data/buildings.manifest.json') }}

      - name: Fetch the map tiles
        run: make tiles

      - name: Unit tests
        # Coverage is measured and reported from M0 but does not gate until M3.
        # The database-backed tests truncate-and-rollback their own tables (see
        # conftest.py), so no seed step is needed here — only a migrated schema.
        run: pytest -q --cov=nightshift --cov-report=term-missing
        working-directory: services/api

  web:
    name: web — lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/web

      - name: Format check
        run: npm run fmt:check
        working-directory: apps/web

      - name: Lint
        run: npm run lint
        working-directory: apps/web

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/web

      - name: Unit tests
        run: npm run test
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

  migrations:
    name: migrations — up, down, up, and no drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # The same extension pair as infra/docker-compose.yml. Built here from
        # the committed Dockerfile would cost a minute per run, so CI uses a
        # prebuilt image with both extensions and the migration asserts they
        # exist rather than assuming it.
        #
        # Two things about this reference are load-bearing and were both wrong
        # until the first CI run proved it: the tag is `-bundle0`, not
        # `-bundle`, and it is pulled from Docker Hub, because ghcr.io denies
        # anonymous pulls of this package. Verified to provide postgis 3.4.3,
        # vector 0.7.4, pg_trgm and pgcrypto on PostgreSQL 16.4.
        image: imresamu/postgis:16-3.4-bundle0
        env:
          POSTGRES_USER: nightshift
          POSTGRES_PASSWORD: nightshift_ci
          POSTGRES_DB: nightshift
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nightshift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: nightshift
      POSTGRES_PASSWORD: nightshift_ci
      POSTGRES_DB: nightshift
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      NIGHTSHIFT_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/api[dev]"

      - name: Create extensions
        # Mirrors infra/postgres/init/001-extensions.sql. CREATE EXTENSION needs
        # superuser, so it is not the migration's job in any environment.
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U nightshift -d nightshift \
            -f infra/postgres/init/001-extensions.sql

      - name: Upgrade to head
        run: alembic upgrade head
        working-directory: services/api

      - name: Upgrade actually persisted
        # `alembic upgrade head` prints "Running upgrade", emits every CREATE
        # TABLE, and exits 0 even when its transaction is rolled back — the exit
        # code says nothing about whether the database moved. Ask the database.
        run: |
          head_rev=$(alembic heads | awk '{print $1}')
          test -n "$head_rev" || { echo "::error::no head revision"; exit 1; }
          if ! alembic current | grep -q "$head_rev"; then
            echo "::error::alembic exited 0 but the database is not at $head_rev — the migration did not commit"
            alembic current
            exit 1
          fi
        working-directory: services/api

      - name: Downgrade to base
        # CLAUDE.md §7: every migration reversible and tested both directions.
        run: alembic downgrade base
        working-directory: services/api

      - name: Upgrade again
        # The test that catches a downgrade which forgot to drop an enum type —
        # this step fails with "type already exists" if it did.
        run: alembic upgrade head
        working-directory: services/api

      - name: No model/migration drift
        # Autogenerate must produce an empty diff. If it does not, a model was
        # changed without a migration.
        run: |
          alembic revision --autogenerate -m drift_probe --rev-id drift_probe
          if grep -qE '^\s+op\.(create|drop|alter|add)' migrations/versions/*drift_probe.py; then
            echo "::error::models have drifted from migrations — generate a migration"
            cat migrations/versions/*drift_probe.py
            exit 1
          fi
          rm -f migrations/versions/*drift_probe.py
        working-directory: services/api

      - name: Seed loads
        env:
          OUTBOUND_HTTP_ENABLED: 'false'
        # Proves the offline demo path works from a clean database, and that
        # `make demo` is not going to fail on someone's first clone.
        run: python -m nightshift.cli seed
        working-directory: services/api

  e2e:
    name: e2e — degraded shell and seeded corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A14's scope list does not mention e2e, and it was deliberately deferred.
    # It comes back in because the seeded suite is now the only automated proof
    # of M0 acceptance criterion 5 — that a real board's jobs reach a browser.
    # An acceptance criterion with no CI coverage is one that regresses quietly.
    # This job runs in parallel with the others, so wall-clock CI stays inside
    # A14's five-minute target.
    services:
      postgres:
        # Kept identical to the migrations job above — see the note there.
        image: imresamu/postgis:16-3.4-bundle0
        env:
          POSTGRES_USER: nightshift
          POSTGRES_PASSWORD: nightshift_ci
          POSTGRES_DB: nightshift
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nightshift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: nightshift
      POSTGRES_PASSWORD: nightshift_ci
      POSTGRES_DB: nightshift
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NIGHTSHIFT_ENV: test
      OUTBOUND_HTTP_ENABLED: 'false'
      HTTP_USER_AGENT: 'Nightshift/0.1-ci (+https://github.com/Tahmudun/Nightshift)'
      NEXT_PUBLIC_API_BASE_URL: 'http://127.0.0.1:8000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/api[dev]"

      - name: Install js deps
        run: npm ci
        working-directory: apps/web

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Create extensions
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U nightshift -d nightshift \
            -f infra/postgres/init/001-extensions.sql

      - name: Migrate
        run: alembic upgrade head
        working-directory: services/api

      - name: Seed
        run: python -m nightshift.cli seed
        working-directory: services/api

      - name: Degraded shell e2e
        # Must run before the API starts: this suite asserts the app says
        # "api unreachable" rather than showing an ambiguous empty state, so a
        # running API would make it pass for the wrong reason.
        run: npm run test:e2e
        working-directory: apps/web

      - name: Seeded corpus e2e
        # playwright.seeded.config.ts starts both the web server and the API and
        # waits for /health, so there is no start-the-API step here to drift out
        # of sync with what a developer runs locally.
        run: npm run test:e2e:seeded
        working-directory: apps/web

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

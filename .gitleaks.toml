# gitleaks configuration.
#
# The repo is zero-key by design through M4 (AMENDMENTS A9), so the scan's job
# is to keep it that way rather than to manage exceptions. The only allowlisted
# values are the local development Postgres password, which appears in
# .env.example and docker-compose.yml on purpose and grants access to nothing.

[extend]
useDefault = true

[[rules]]
id = "nightshift-dev-password-outside-example"
description = "Development Postgres password used outside the files allowed to contain it"
regex = '''nightshift_dev_only'''

  # "Everywhere except these four files" is expressed as a rule-level allowlist,
  # NOT as a negative lookahead in `path`. gitleaks compiles these with Go's
  # regexp, which is RE2 — it has no `(?!...)` and panics on one at config load,
  # before scanning a single file. That is a scan which always exits non-zero
  # and never inspects anything, so it cannot be distinguished from a strict
  # scan by looking at whether CI is red.
  [rules.allowlist]
  description = "The files entitled to contain the local development password"
  paths = [
    '''^\.env\.example$''',
    '''^infra/docker-compose\.yml$''',
    '''^services/api/nightshift/config\.py$''',
    '''^README\.md$''',
    # Asserts the password is confined to the files above, so it must name it.
    '''^services/api/tests/test_env_example\.py$''',
    # The acceptance evidence for "no secrets committed" quotes the value.
    '''^docs/PROGRESS\.md$''',
    # This file: the rule's own regex is a literal copy of the string.
    '''^\.gitleaks\.toml$''',
  ]

[[rules]]
id = "nightshift-session-token"
description = "A Nightshift session or MCP token (identity.py TOKEN_PREFIX)"
# 32 bytes through `secrets.token_urlsafe` is 43 characters; the floor is 40 so
# the rule keeps matching if TOKEN_BYTES is ever raised, and stays clear of the
# bare prefix, which appears in tests and documentation on purpose.
regex = '''nsk_[A-Za-z0-9_-]{40,}'''

[allowlist]
description = "Local development defaults — not credentials to anything reachable"
paths = [
  '''^\.env\.example$''',
  '''^infra/docker-compose\.yml$''',
  '''^\.github/workflows/ci\.yml$''',
  # Recorded ATS payloads. Public, unauthenticated board responses; they contain
  # no tokens, but they are large and full of URLs that trip entropy heuristics.
  '''^services/api/tests/fixtures/''',
]
regexes = [
  '''nightshift_ci''',
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.1.0"
description = "Nightshift API, ingestion adapters, and background workers"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "geoalchemy2>=0.15",
  "arq>=0.26",
  "redis>=5.2",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "structlog>=24.4",
  # AMENDMENTS A5: embeddings run locally. bge-small-en-v1.5 via fastembed —
  # free, offline, deterministic, no vendor. pgvector is the storage side.
  # Added at M1b, which is the milestone that first reads them (ADR 0010).
  "pgvector>=0.3.6",
  "fastembed>=0.4.2",
  # M2c: resume text. Pure Python, no native libraries and no key, so
  # `make demo` still runs offline (A9). pypdf reads only — it never writes a
  # file back, and the uploaded bytes are discarded after extraction.
  "pypdf>=5.1",
  # FastAPI needs this to parse a multipart upload at all. Also pure Python.
  "python-multipart>=0.0.20",
  # M5b: password hashing (ADR 0037). argon2id is the current OWASP default and
  # the reference implementation is the only sane way to get it — hand-rolling
  # a password hash is malpractice. Wheels are prebuilt, so `make setup` does
  # not need a compiler and `make demo` stays offline.
  "argon2-cffi>=23.1",
]

# Deliberately absent until the milestone that needs them, per CLAUDE.md §8:
#   beautifulsoup / lxml  -> only if regex HTML-to-text proves insufficient
[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["nightshift*"]

[tool.setuptools.package-data]
nightshift = ["py.typed"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle + pyflakes
  "I",                # import sorting
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "ASYNC",            # async correctness
  "DTZ",              # naive-datetime bans — see CLAUDE.md §7 "Time"
  "T20",              # no print() in library code
  "RUF",
  "TD",               # TODO must carry context
  "FIX",
]
ignore = [
  "B008",             # FastAPI Depends() in defaults is the framework idiom
  "TD003",            # we require a milestone tag, not an issue link
  "FIX002",           # ...and a tagged TODO is allowed to exist
]
# CLAUDE.md §7: a bare TODO is a lint failure. TD002 (missing-todo-author) is
# what enforces it — it requires the parenthesised slot, which we use for the
# milestone: `TODO(M3): extend the eligibility ruleset`.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"nightshift/cli.py" = ["T20"]          # a CLI prints; that is its job
"nightshift/discovery/cli.py" = ["T20"]  # ...and so does this one
"scripts/*" = ["T20"]                  # so does a script run by a human

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/versions/"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "arq.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
markers = [
  "integration: requires a live postgres and redis (skipped when unavailable)",
]
filterwarnings = ["error::DeprecationWarning:nightshift.*"]

[tool.coverage.run]
source = ["nightshift"]
omit = ["*/migrations/*"]

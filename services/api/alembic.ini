[alembic]
script_location = migrations
prepend_sys_path = .
# UTC, and a sortable prefix so `ls migrations/versions` is chronological.
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
# sqlalchemy.url is intentionally absent: env.py takes it from validated
# settings, so there is exactly one source of truth for the connection string
# and no chance of a committed credential.

[post_write_hooks]
# `module`, not `console_scripts`: ruff ships a compiled binary as a plain
# script and declares no console_scripts entry point at all, so the entrypoint
# lookup fails with "Could not find entrypoint console_scripts.ruff" and takes
# the whole `alembic revision` command down with it. `module` runs
# `sys.executable -m ruff`, which is the interpreter already running alembic —
# correct inside the venv and on CI without either needing ruff on PATH.
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
